<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <h1>Todo App</h1>

        <div class="add-row">
            <input id="new-todo" type="text" placeholder="What needs doing?" autocomplete="off" />
            <button id="add-btn" class="btn-add">Add</button>
        </div>

        <div class="toolbar">
            <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>
            <div class="filters" id="filters">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="active">Active</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>
        </div>

        <ul id="todo-list"></ul>

        <footer class="footer">
            <span id="count">0 items left</span>
            <div class="clear-btns">
                <button id="clear-completed" class="btn-clear">Clear completed</button>
                <button id="clear-all" class="btn-clear">Clear all</button>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
